<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий TikTok Загрузчик</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #171721;
            --accent-color: #fe2c55;
            --accent-hover: #e02447;
            --text-color: #ffffff;
            --text-muted: #a0a0ab;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            background-color: #242433;
            border: 2px solid transparent;
            border-radius: 10px;
            color: #fff;
            padding: 15px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }

        .video-container {
            display: none;
            margin-top: 24px;
            border-top: 1px solid #2d2d3d;
            padding-top: 24px;
        }

        video {
            width: 100%;
            border-radius: 12px;
            background-color: #000;
            max-height: 450px;
            margin-bottom: 15px;
        }

        .instructions {
            font-size: 13px;
            color: var(--text-muted);
            background: #20202e;
            padding: 10px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .error-msg {
            color: var(--accent-color);
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TikTok Загрузчик</h1>
    <p>Оригинальное видео без водяного знака</p>

    <div class="input-group">
        <input type="text" id="tiktokUrl" placeholder="Вставьте ссылку (vm.tiktok.com...)" autocomplete="off">
        <button id="btnFetch" onclick="processVideo()">Очистить и загрузить</button>
    </div>

    <div id="errorBox" class="error-msg"></div>

    <div id="resultContainer" class="video-container">
        <video id="videoPlayer" controls playsinline></video>
        <div class="instructions">
            Файл готов! Нажмите на <strong>три точки</strong> в углу плеера -> <strong>«Скачать»</strong> для сохранения на устройство.
        </div>
    </div>
</div>

<script>
    async function processVideo() {
        const urlInput = document.getElementById('tiktokUrl').value.trim();
        const videoContainer = document.getElementById('resultContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const errorBox = document.getElementById('errorBox');
        const btn = document.getElementById('btnFetch');

        // Сброс состояния
        errorBox.style.display = 'none';
        videoContainer.style.display = 'none';

        if (!urlInput || !urlInput.includes('tiktok.com')) {
            showError('Пожалуйста, введите корректную ссылку на TikTok.');
            return;
        }

        // Блокируем кнопку на время запроса
        btn.disabled = true;
        btn.innerText = 'Обработка...';

        try {
            // Используем публичный CORS-шлюз и API для получения прямой ссылки на MP4
            const apiUrl = 'https://www.tikwm.com/api/';
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'url': urlInput,
                    'hd': '1' // Запрашиваем в HD качестве
                })
            });

            const resData = await response.json();

            if (resData && resData.code === 0 && resData.data && resData.data.play) {
                // 'play' содержит прямую ссылку на видео без водяного знака
                let cleanVideoUrl = resData.data.play;
                
                // Исправляем протокол, если API возвращает относительную ссылку
                if (cleanVideoUrl.startsWith('//')) {
                    cleanVideoUrl = 'https:' + cleanVideoUrl;
                }

                // Передаем ссылку в плеер
                videoPlayer.src = cleanVideoUrl;
                videoContainer.style.display = 'block';
                videoPlayer.load();
            } else {
                showError(resData.msg || 'Не удалось извлечь чистый файл. Возможно, видео приватное.');
            }

        } catch (error) {
            console.error(error);
            showError('Ошибка соединения с сервером. Попробуйте еще раз.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Очистить и загрузить';
        }
    }

    function showError(text) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = text;
        errorBox.style.display = 'block';
    }
</script>

</body>
</html>
